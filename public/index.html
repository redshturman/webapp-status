<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado de servicios</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DISPONIBILIDAD HTTP</p>
      <h1>Estado de servicios</h1>
      <p>Comprobaciones desde este servidor, no desde tu navegador.</p>
    </header>
    <p id="connection" role="status">Conectando con el panel…</p>
    <div class="table-wrap">
      <table>
        <caption class="sr-only">Último resultado de cada servicio</caption>
        <thead>
          <tr><th>Servicio</th><th>Estado</th><th>Detalle</th><th>Respuesta</th><th>Última comprobación</th></tr>
        </thead>
        <tbody id="services"></tbody>
      </table>
    </div>
    <footer>
      <p id="cadence"></p>
      <p>Un HTTP aceptado no garantiza que todas las funciones del servicio estén operativas.</p>
    </footer>
  </main>
</body>
</html>
