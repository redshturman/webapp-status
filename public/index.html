<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado de servicios</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Estado de servicios</h1>
    </header>
    <p id="connection" role="status" hidden></p>
    <div class="table-wrap">
      <table>
        <caption class="sr-only">Último resultado de cada servicio</caption>
        <thead>
          <tr><th>Servicio</th><th>Estado</th><th>Detalle</th><th>Respuesta</th><th>Última comprobación</th></tr>
        </thead>
        <tbody id="services"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
